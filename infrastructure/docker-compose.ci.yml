# CI-only SeaweedFS stack (no external Docker network).
# Usage:
#   docker compose -f docker-compose.ci.yml up -d --wait
#   docker compose -f docker-compose.ci.yml down -v
name: maritime-fishing-ci
services:
  master:
    image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    command: "master -ip=master -mdir=/data"
    volumes:
      - master_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://master:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  volume:
    image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    command: "volume -ip=volume -master=master:9333 -dir=/data"
    depends_on:
      master:
        condition: service_healthy
    volumes:
      - volume_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://volume:8080/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  filer:
    image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    command: "filer -ip=filer -master=master:9333 -defaultStoreDir=/data"
    depends_on:
      master:
        condition: service_healthy
      volume:
        condition: service_healthy
    volumes:
      - filer_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://filer:8888/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  s3:
    image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    command: "s3 -filer=filer:8888 -config=/etc/seaweedfs/s3.json"
    depends_on:
      filer:
        condition: service_healthy
    ports:
      - "${S3_HOST_PORT:-8333}:8333"
    volumes:
      - type: bind
        source: ./s3.ci.json
        target: /etc/seaweedfs/s3.json
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -Eq "HTTP/[0-9.]+ (200|403)"'
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s

volumes:
  master_data:
  volume_data:
  filer_data:
